# Production stack — frontend served by nginx, backend via FastAPI, PostgreSQL DB.
# Copy backend/.env.example to backend/.env and fill in values before running locally.

services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: ml_platform_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mluser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlpassword}
      POSTGRES_DB: ${POSTGRES_DB:-ml_platform}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mluser}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # ─── Backend (FastAPI) ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ml_platform_backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mluser}:${POSTGRES_PASSWORD:-mlpassword}@db:5432/${POSTGRES_DB:-ml_platform}
    volumes:
      - ml_uploads:/app/uploadfiles
      - ml_models:/app/trained_models
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net

  # ─── Frontend (nginx serving built dist) ─────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: ml_platform_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - app_net

volumes:
  postgres_data:
  ml_uploads:
  ml_models:

networks:
  app_net:
    driver: bridge
