name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8 (Optional)
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run Backend Tests
      run: |
        # Set PYTHONPATH to ensure the app module can be found
        export PYTHONPATH=$PYTHONPATH:$(pwd)/app
        pytest app/tests/

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Frontend Unit Tests
      run: npm run test:unit

    - name: Build Project
      run: npm run build

deploy:
  needs: [build-backend, build-frontend]
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    # 1. Rebuild the front end
    - name: Build Frontend for Deploy
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

    # 2. Send the frontend dist and backend code to EC2
    - name: Copy Files to EC2
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "frontend/dist/**,backend/**,deploy/docker-compose.yml"
        target: "/home/ubuntu/churn-project"
        strip_components: 0 # Retain the original directory structure
        rm: true

    # 3. Restart Docker containers via SSH on a remote server
    - name: Restart Services on EC2
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          cd /home/ubuntu/churn-project
          # Ensure directory permissions are correct for Nginx to read
          sudo chmod -R 755 frontend/dist
          # Restart the backend container
          cd deploy
          sudo docker compose down
          sudo docker compose up -d --build
          # Clean up useless images to save space
          sudo docker system prune -f