name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Backend Integration (Lint + Test)
  # ------------------------------------------------------------------
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install flake8 pytest httpx
        
    - name: Lint with Flake8
      run: |
        flake8 . --count --show-source --statistics

    - name: Run Backend Tests
      run: |
        # Set PYTHONPATH to ensure the app module can be found
        export PYTHONPATH=$PYTHONPATH:$(pwd)/app
        pytest app/tests/

  # ------------------------------------------------------------------
  # JOB 2: Frontend Build (Test + Build + Upload Artifact)
  # ------------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run Frontend Unit Tests
      run: npm run test:unit

    - name: Build Project
      run: npm run build

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: frontend/dist/
        retention-days: 1

  # ------------------------------------------------------------------
  # JOB 3: Deployment (Download Artifact + Ship to EC2)
  # ------------------------------------------------------------------
  deploy:
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main' 
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 1. Download the pre-built front-end artifacts (to avoid recompiling)
      - name: Download Frontend Artifact
        uses: actions/download-artifact@v3
        with:
          name: frontend-dist
          path: frontend-dist

      # 2. Compress the front-end file (for faster SCP transfer)
      - name: Compress Frontend Assets
        run: tar -zcvf ../frontend-dist.tar.gz -C frontend-dist .


      # 3. Send the frontend dist and backend code to EC2
      - name: Copy Compressed Artifact to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend-dist.tar.gz,backend/**,!backend/venv/**,!backend/__pycache__/**"
          target: "/home/ubuntu/churn-project"
          rm: false

      # 4. Restart Docker containers via SSH on a remote server
      - name: Extract and Restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/churn-project

            sudo rm -rf frontend/dist/*
            sudo mkdir -p frontend/dist

            sudo tar -xzvf frontend-dist.tar.gz -C frontend/dist
            rm frontend-dist.tar.gz

            # Ensure directory permissions are correct for Nginx to read
            sudo chmod -R 755 frontend/dist
            # Restart the backend container
            cd backend
            sudo docker compose down
            sudo docker compose up -d --build
            # Clean up useless images to save space
            sudo docker system prune -f