name: CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Backend: lint + tests (SQLite used in CI; no external DB needed)
  # ────────────────────────────────────────────────────────────────────────────
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with Flake8
        run: |
          pip install flake8
          flake8 app/ --count --show-source --statistics --max-line-length=120

      - name: Run tests
        env:
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          SECRET_KEY: ci-secret-key-not-used-in-production
        run: |
          pytest tests/ -v --tb=short

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Frontend: type-check + tests + build + upload artifact
  # ────────────────────────────────────────────────────────────────────────────
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 3 — Deploy to EC2 (main branch only)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    needs: [build-backend, build-frontend]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Compress frontend assets
        run: |
          tar -zcvf frontend-dist.tar.gz -C frontend-dist .
          ls -lh frontend-dist.tar.gz

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "frontend-dist.tar.gz,backend/**,docker-compose.yml,deploy/**"
          target: "/home/ubuntu/ml-platform"
          overwrite: true

      - name: Extract and restart services
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/ml-platform

            echo "=== Deploying frontend ==="
            sudo rm -rf frontend/dist
            mkdir -p frontend/dist
            tar -xzf frontend-dist.tar.gz -C frontend/dist
            rm frontend-dist.tar.gz
            chmod -R 755 frontend/dist

            echo "=== Restarting services ==="
            sudo docker compose down
            sudo docker compose up -d --build
            sudo docker system prune -f

            echo "=== Deploy complete ==="
            sudo docker compose ps
